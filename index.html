    <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA6tJEOSrPVcdKw2rrd5cEtTBr-PpFgNr4",
    authDomain: "finanzplaner-77cf7.firebaseapp.com",
    databaseURL: "https://finanzplaner-77cf7-default-rtdb.firebaseio.com/",
    projectId: "finanzplaner-77cf7",
    storageBucket: "finanzplaner-77cf7.firebasestorage.app",
    messagingSenderId: "475145696335",
    appId: "1:475145696335:web:f989e63d36383953f1a63a",
    measurementId: "G-4GR5QPP5E9"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // 🔹 Eintrag speichern
  window.addEntry = function(name, amount) {
    const entriesRef = ref(db, "entries");
    const newEntryRef = push(entriesRef);
    set(newEntryRef, {
      name: name,
      amount: amount,
      timestamp: Date.now()
    });
  };

  // 🔹 Echtzeit-Updates
  const entriesRef = ref(db, "entries");
  onValue(entriesRef, (snapshot) => {
    const data = snapshot.val();
    console.log("Aktuelle Daten:", data);
  });
</script>
