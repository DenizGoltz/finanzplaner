<script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js"></script>

<script>
  // 🔹 Firebase-Konfiguration
  const firebaseConfig = {
    apiKey: "AIzaSyA6tJEOSrPVcdKw2rrd5cEtTBr-PpFgNr4",
    authDomain: "finanzplaner-77cf7.firebaseapp.com",
    databaseURL: "https://finanzplaner-77cf7-default-rtdb.firebaseio.com",
    projectId: "finanzplaner-77cf7",
    storageBucket: "finanzplaner-77cf7.firebasestorage.app",
    messagingSenderId: "475145696335",
    appId: "1:475145696335:web:f989e63d36383953f1a63a"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const entriesRef = db.ref("entries");

  // 🔹 Funktion: Eintrag hinzufügen
  function addEntry(name, amount) {
    if (!name || !amount) return;
    const newEntryRef = entriesRef.push();
    newEntryRef.set({
      name: name,
      amount: Number(amount),
      timestamp: Date.now()
    });
  }

  window.addEntry = function(name, amount) {
    addEntry(name, amount);
  };

  // 🔹 Echtzeit-Listener: alle Einträge auf der Seite anzeigen
  function renderEntries(data) {
    const mainContent = document.getElementById("mainContent");
    mainContent.innerHTML = ""; // alte Inhalte löschen

    if (!data) {
      mainContent.innerHTML = "<p>Keine Einträge vorhanden</p>";
      return;
    }

    // Summen berechnen
    let total = 0;
    const ul = document.createElement("ul");
    ul.className = "entry-list";

    Object.keys(data).forEach(key => {
      const entry = data[key];
      total += entry.amount;

      const li = document.createElement("li");
      li.textContent = `${entry.name}: ${entry.amount} €`;

      // Löschen-Button
      const delBtn = document.createElement("button");
      delBtn.textContent = "❌";
      delBtn.style.marginLeft = "10px";
      delBtn.onclick = () => {
        entriesRef.child(key).remove();
      };

      li.appendChild(delBtn);
      ul.appendChild(li);
    });

    mainContent.appendChild(ul);

    // Gesamtsumme anzeigen
    const sumDiv = document.createElement("div");
    sumDiv.style.marginTop = "10px";
    sumDiv.style.fontWeight = "bold";
    sumDiv.textContent = `Gesamt: ${total} €`;
    mainContent.appendChild(sumDiv);
  }

  entriesRef.on("value", snapshot => {
    const data = snapshot.val();
    renderEntries(data);
  });

  // 🔹 Beispiel: Modal hinzufügen -> Eintrag erstellen
  document.getElementById("quickAddBtn").onclick = () => {
    const name = prompt("Name der Transaktion?");
    const amount = prompt("Betrag?");
    if (name && amount) addEntry(name, amount);
  };
</script>
